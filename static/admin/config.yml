      - { label: "Context", name: "context", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "string", required: false, hint: "YYYY-MM-DD" }
      - { label: "Banner Image", name: "image", widget: "image", required: false, hint: "JPG, PNG or WebP only (no GIF/SVG). Keep it under 500 KB; larger files fail to save." }
